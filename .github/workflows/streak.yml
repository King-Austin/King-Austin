name: Keep Streak Alive

on:
  schedule:
    - cron: "*/40 * * * *"
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update streak file
        run: |
          mkdir -p .github/streak
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .github/streak/last-commit.txt
          cat .github/streak/last-commit.txt

      - name: Commit and push
        run: |
          git config user.name "King Austin (Streak Bot)"
          git config user.email "nworahebuka.a@gmail.com"
          git add .github/streak/last-commit.txt
          git commit -m "chore: keep streak alive at $(date -u +'%H:%M UTC')" || echo "No changes to commit"
          git push